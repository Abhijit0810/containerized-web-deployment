version: '3.8'

services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: abhijitnaik/containerized-web-app:latest
    container_name: frontend-nginx-service
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cloud-network

  mock-backend-api:
    image: node:20-alpine
    container_name: mock-api-service
    restart: unless-stopped
    working_dir: /app
    command: >
      node -e "
        const http = require('http');
        const server = http.createServer((req, res) => {
          res.setHeader('Content-Type', 'application/json');
          if (req.url === '/api/v1/status') {
            res.end(JSON.stringify({ status: 'ok', cluster: 'k8s-prod-cluster', uptime: process.uptime() }));
          } else {
            res.end(JSON.stringify({ message: 'Mock API response' }));
          }
        });
        server.listen(5000, () => console.log('Mock API running on :5000'));
      "
    ports:
      - "5000:5000"
    networks:
      - cloud-network

networks:
  cloud-network:
    driver: bridge
